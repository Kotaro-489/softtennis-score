name: Flutter CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  analyze-and-test:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Dart Format
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test

      - name: Integration Test
        run: flutter test integration_test -d macos

  watch-build-and-test:
    runs-on: macos-15-intel

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify Xcode version
        run: xcodebuild -version | grep -F 'Xcode 26.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Watch app
        run: >-
          xcodebuild
          -workspace ios/Runner.xcworkspace
          -scheme SoftTennisScoreWatch
          -configuration Release
          -sdk watchos
          -destination 'generic/platform=watchOS'
          -derivedDataPath build/watch-derived-data
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify Series 3 armv7k slice
        run: |
          WATCH_BINARY="$(find build/watch-derived-data/Build/Products -path '*SoftTennisScoreWatch.app/SoftTennisScoreWatch' -type f | head -1)"
          test -n "$WATCH_BINARY"
          xcrun lipo -archs "$WATCH_BINARY" | grep -w armv7k

      - name: Run Swift unit tests
        run: >-
          xcodebuild test
          -workspace ios/Runner.xcworkspace
          -scheme SoftTennisScoreWatch
          -destination 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm)'
          -derivedDataPath build/watch-test-derived-data
          CODE_SIGNING_ALLOWED=NO

      - name: Archive iPhone app with Watch companion
        run: >-
          xcodebuild archive
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/SoftTennisScore.xcarchive
          -derivedDataPath build/archive-derived-data
          CODE_SIGNING_ALLOWED=NO

      - name: Verify archived Watch companion
        run: |
          PHONE_APP="build/SoftTennisScore.xcarchive/Products/Applications/Runner.app"
          WATCH_APP="$PHONE_APP/Watch/SoftTennisScoreWatch.app"
          WATCH_BINARY="$WATCH_APP/SoftTennisScoreWatch"
          test -d "$PHONE_APP"
          test -d "$WATCH_APP"
          test -f "$WATCH_BINARY"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH_APP/Info.plist")" = 'com.kotaro489.softtennisscore.watchapp'
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH_APP/Info.plist")" = 'com.kotaro489.softtennisscore'
          xcrun lipo -archs "$WATCH_BINARY" | grep -w armv7k
