name: Flutter CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  analyze-and-test:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Dart Format
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test

      - name: Integration Test
        run: flutter test integration_test -d macos
